name: postgres-homework-03

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course_hw03
    volumes:
      - homework_data:/var/lib/postgresql
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course_hw03"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  homework_data:
